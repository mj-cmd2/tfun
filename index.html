<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rolling 2027 — Prototype</title><style>

main{width:390px;max-width:100%;padding-top:0}.app-header{background:#3025ab;color:white;margin:0 -14px;padding:10px 12px 0;text-align:left}.app-top{display:flex;align-items:center;justify-content:space-between;min-height:38px}.app-top strong{font-size:16px;letter-spacing:.5px}.gear{border:0;background:transparent;color:white;padding:6px;display:grid;place-items:center}.tabs{display:flex;gap:0;margin-top:4px}.tabs button{flex:1;border:0;border-bottom:3px solid transparent;background:transparent;color:#e3e0ff;padding:12px 4px;font-weight:650}.tabs button.active{color:white;border-bottom-color:white}.settings{width:390px;max-width:100%;max-height:90dvh;overflow:auto;border:0;border-radius:12px;padding:16px;margin:auto;background:#f0eff8;color:#272451}.settings::backdrop{background:#16133388}.settings-heading{display:flex;justify-content:space-between;align-items:center;font-weight:700}.settings-heading button{border:0;background:transparent;font-size:25px;line-height:1;padding:5px}.context-field{display:none!important}.view-toggle{display:flex;justify-content:flex-end;align-items:center;gap:8px;margin:0 0 8px}.view-toggle button{border:1px solid #3025ab;background:white;border-radius:24px;padding:3px;display:flex;gap:2px}.view-toggle button span{display:grid;place-items:center;width:34px;height:28px;border-radius:20px;color:#3025ab}.view-toggle button span.active{background:#3025ab;color:white}.view-toggle .view-label{font-size:12px;font-weight:600}.score{font-size:14px}.delta{font-size:9px}.track{width:60%}

ue="0.7">70 %</option></select></label><label>Position des contrôles<select id="controlPosition"><option value="classic">Classique</option><option value="global">Sticky — scroll global</option><option value="internal">Sticky — scroll interne</option></select></label><label class="check"><input id="auto" type="checkbox" checked> Autoplay</label><label class="check"><input id="variation" type="checkbox" checked> Variations</label><label class="check"><input id="cta" type="checkbox"> CTA</label><label class="check"><input id="timelineOn" type="checkbox" checked> Frise</label><label>Titre<input id="titleInput" value="Evolution des sondages"></label><label>Baseline<input id="baselineInput" value="Suivez les sondages quotidiens réalisés avec l’IFOP pour TF1 et LCI"></label></div><button id="reset" style="margin-top:12px">Relancer le test (conserver les réglages)</button></dialog><main><div class="app-header"><div class="app-top"><strong>ROLLING 2027</strong><div style="display:flex;align-items:center;gap:8px"><button class="gear" id="refreshTest" aria-label="Relancer le test" title="Relancer le test sans modifier les réglages"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 7v5h-5M20 12a8 8 0 1 0-2.3 5.7"/></svg></button><button class="gear" id="openSettings" aria-label="Ouvrir les réglages"><svg width="25" height="25" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 2h4l.6 3 2 .9 2.6-1.7 2.8 2.8-1.7 2.6.9 2 2.8.4v4l-3 .6-.9 2 1.7 2.6-2.8 2.8-2.6-1.7-2 .9-.4 2.8h-4l-.6-3-2-.9-2.6 1.7L2 21l1.7-2.6-.9-2L0 16v-4l3-.6.9-2L2.2 6.8 5 4l2.6 1.7 2-.9z" transform="translate(2 0) scale(.83)"/><circle cx="12" cy="12" r="3.2"/></svg></button></div></div><nav class="tabs" aria-label="Contextes du prototype"><button data-context="landing">LP</button><button data-context="home">HP</button><button data-context="tf">2027</button></nav></div><div id="mock" class="mock hidden"></div><div id="rollingComponent" class="rolling-component"><header><h1 id="title"></h1><p id="baseline"></p></header><div class="module-toolbar"><div class="switch hidden" id="tours"><button data-tour="1">1er tour</button><button data-tour="2">2nd tour</button></div><div class="view-toggle"><span hidden id="viewLabel"></span><button id="viewToggle" role="switch" aria-label="Vue graphique" aria-checked="false"><span data-view-icon="race"><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><rect x="3" y="4" width="18" height="4" rx="1"/><rect x="3" y="10" width="13" height="4" rx="1"/><rect x="3" y="16" width="8" height="4" rx="1"/></svg></span><span data-view-icon="graph"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4v16h18M5 15l5-6 4 4 6-8"/></svg></span></button></div></div><section id="module"><div id="graphDate" class="date hidden"></div><div class="panel" id="visual"><div id="race" class="race"></div><svg id="graph" class="chart hidden" viewBox="0 0 330 350" aria-label="Courbes des sondages fictifs"></svg><div id="legend" class="legend hidden"></div></div><div class="panel" id="controlPanel"><div class="date" id="date"></div><div class="timeline" id="timeline"><div class="ticks"></div><input id="scrub" type="range" min="0" value="0" aria-label="Date du sondage"><div class="months" id="months"></div></div><div class="controls" id="controls"><button id="play" class="primary">▷ Lire</button><button id="prev">❮ Préc.</button><button id="next">Suiv. ❯</button></div></div><button id="ctaButton" class="cta hidden">Voir l’évolution complète ›</button><p class="note">PROTOTYPE • Données intégralement fictives • Aucun sondage IFOP réel</p></section></div><div id="mockAfter" class="mock hidden"></div></main><script src="rolling.js" defer></script></body></html>
